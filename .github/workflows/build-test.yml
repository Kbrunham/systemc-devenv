name: build-test

on:
  push:
    branches:
    - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

defaults:
  run:
    shell: bash

env:
    BOOST_VERSION: 1.86.0
    SYSTEMC_VERSION: 3.0.2
    BOOST_ROOT: ${{ github.workspace }}/boost
    SYSTEMC_HOME: ${{ github.workspace }}/systemc

# Ensure only one instance of the workflow is running for a given branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clear-status:
    runs-on: ubuntu-latest
    steps:
      - name: Clear status
        uses: myrotvorets/set-commit-status-action@v2.0.1
        if: ${{ !env.ACT }}
        with:
          context: build-test-status
          status: "pending"
          token: ${{ secrets.GH_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    needs: [clear-status]
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.10'

    - uses: lukka/get-cmake@v4.4.0
      with:
        # Match cmake_minimum_required(VERSION 3.24) and PLANNING (Ubuntu 24.04 → 3.28)
        cmakeVersion: "~3.28.0"
        ninjaVersion: "^1.10.1"

    - name: Prepare Venv
      run: make venv

    - name: Cache Boost
      id: cache-boost
      uses: actions/cache@v6.1.0
      with:
        path: boost
        key: ${{ runner.os }}-boost-${{ env.BOOST_VERSION }}

    - name: Prepare Boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: make boost

    - name: Stamp Boost (cache hit)
      if: steps.cache-boost.outputs.cache-hit == 'true'
      run: |
        mkdir -p .stamps
        touch .stamps/boost.done

    - name: Cache SystemC
      id: cache-systemc
      uses: actions/cache@v6.1.0
      with:
        path: systemc
        key: ${{ runner.os }}-systemc-${{ env.SYSTEMC_VERSION }}

    - name: Prepare SystemC
      if: steps.cache-systemc.outputs.cache-hit != 'true'
      run: make systemc

    - name: Stamp SystemC (cache hit)
      if: steps.cache-systemc.outputs.cache-hit == 'true'
      run: |
        mkdir -p .stamps
        touch .stamps/systemc.done

    - name: Build and test
      run: make test

  post-status:
    name: Post Status
    runs-on: ubuntu-latest
    needs: [clear-status, build-test]
    if: always()
    steps:
      - name: Update commit status
        uses: myrotvorets/set-commit-status-action@v2.0.1
        if: ${{ !env.ACT }}
        with:
          context: build-test-status
          status: ${{ job.status }}
          token: ${{ secrets.GH_TOKEN }}
